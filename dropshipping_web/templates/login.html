{% extends "base.html" %}
{% block title %}Giriş Yap{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-lg border-0" style="border-radius: 16px;">
            <div class="card-body p-5">
                <h3 class="text-center mb-4"><i class="fas fa-sign-in-alt me-2"></i>Giriş Yap</h3>
                <form action="/token" method="post">
                    <div class="mb-3">
                        <label class="form-label">Kullanıcı Adı</label>
                        <input type="text" name="username" class="form-control" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Şifre</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">Giriş Yap</button>
                </form>
                <p class="text-center mt-3 mb-0">Hesabın yok mu? <a target="_self" href="/kayit">Kayıt ol</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

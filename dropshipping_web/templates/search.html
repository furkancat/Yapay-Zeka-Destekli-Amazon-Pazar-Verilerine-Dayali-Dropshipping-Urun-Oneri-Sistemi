{% extends "base.html" %}
{% block title %}Ürün Ara{% endblock %}
{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h4><i class="fas fa-search me-2 text-primary"></i>Ürün Ara</h4>
        <p class="text-muted">Arama tamamen <strong>bedava</strong>. Detaylı analiz için ürüne tıklayın.</p>
    </div>
</div>

<!-- Arama Formu (HTMX) -->
<div class="card shadow-sm mb-4" style="border-radius: 12px;">
    <div class="card-body">
        <form hx-post="/search" hx-target="#sonuclar" hx-indicator="#yukleniyor">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label">Kategori</label>
                    <select name="kategori" class="form-select">
                        <option value="">Tümü</option>
                        {% for k in kategoriler %}
                        <option value="{{ k }}">{{ k }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Anahtar Kelime</label>
                    <input type="text" name="q" class="form-control" placeholder="örn: bluetooth">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Max BSR</label>
                    <input type="number" name="max_bsr" class="form-control" placeholder="50000">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Min Fiyat</label>
                    <input type="number" step="0.01" name="min_fiyat" class="form-control" placeholder="0">
                </div>
                <div class="col-md-2">
                    <label class="form-label">Max Fiyat</label>
                    <input type="number" step="0.01" name="max_fiyat" class="form-control" placeholder="999">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Sıralama</label>
                    <select name="siralama" class="form-select">
                        <option value="bsr_asc">BSR (Düşük → Yüksek)</option>
                        <option value="bsr_desc">BSR (Yüksek → Düşük)</option>
                        <option value="fiyat_asc">Fiyat (Düşük → Yüksek)</option>
                        <option value="fiyat_desc">Fiyat (Yüksek → Düşük)</option>
                    </select>
                </div>
                <div class="col-md-2 d-flex align-items-end">
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="fas fa-search me-1"></i>Ara
                    </button>
                </div>
            </div>
        </form>
    </div>
</div>

<!-- Yükleniyor İndikatörü -->
<div id="yukleniyor" class="htmx-indicator text-center py-4">
    <div class="spinner-border text-primary" role="status"></div>
    <p class="text-muted mt-2">Ürünler aranıyor...</p>
</div>

<!-- Sonuçlar Buraya Gelecek -->
<div id="sonuclar" class="row">
    <div class="col-12 text-center text-muted py-5">
        <i class="fas fa-arrow-up fa-2x mb-3"></i>
        <p>Yukarıdan filtre seçip arama yapabilirsiniz.</p>
    </div>
</div>
{% endblock %}
